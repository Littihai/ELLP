# Build checks on every pull request and every push to main. Nothing here deploys.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — type check + production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: vite build (demo mode, as the public demo is deployed)
        run: npx vite build
        env:
          VITE_USE_DEMO: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: ellp-frontend-dist
          path: frontend/dist

  backend:
    name: Backend — dotnet build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet build backend/Ellp.sln -c Release
      - run: dotnet test backend/Ellp.Api.Tests/Ellp.Api.Tests.csproj -c Release --no-build
